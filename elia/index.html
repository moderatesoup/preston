  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

  .lp{
    position:relative;overflow:hidden;background:var(--accent);
    min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 24px;padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  /* blurred copy, only ever visible where --bg-size leaves a gap */
  .lp-fill{
    position:absolute;inset:0;z-index:0;
    background:var(--photo) center/cover no-repeat;
    filter:blur(34px) brightness(.62) saturate(1.1);transform:scale(1.18);
  }
  .lp-photo{
    position:absolute;inset:0;z-index:1;
    background:var(--photo) var(--bg-focus)/var(--bg-size) no-repeat;
  }
  .lp::after{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:rgba(0,0,0,var(--scrim));
  }
  .lp-body{
    position:relative;z-index:3;width:100%;max-width:340px;
    transform:translateY(var(--content-drop));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }

  .lp-avatar{
    width:var(--avatar);height:var(--avatar);border-radius:50%;border:5px solid #fff;
    object-fit:cover;object-position:var(--avatar-focus);
    margin-bottom:18px;box-shadow:0 4px 20px rgba(0,0,0,.25);
  }
  .lp-name{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:0 0 36px;font-size:30px;font-weight:500;color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.5);
  }
  .lp-btn{
    min-width:260px;max-width:100%;padding:20px 44px;border:0;border-radius:999px;
    background:rgba(255,255,255,.18);color:#fff;
    font:500 18px/1 inherit;font-family:inherit;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:opacity .15s,transform .15s;
  }
  .lp-btn:hover{opacity:.92;transform:translateY(-1px)}
  .lp-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .lp-btn:active{transform:translateY(0)}

  @media (max-width:400px){
    :root{--avatar:150px}
    .lp{padding:32px 18px}
    .lp-name{font-size:26px;margin-bottom:30px}
    .lp-btn{min-width:230px;padding:18px 32px;font-size:17px}
  }
  @media (max-height:640px){
    :root{--avatar:120px;--content-drop:min(0px,8vh)}
    .lp-name{font-size:23px;margin-bottom:22px}
    .lp-btn{padding:15px 30px}
  }
  @media (prefers-reduced-motion:reduce){
    .lp-btn{transition:none}
    .lp-btn:hover{transform:none}
  }
</style>
